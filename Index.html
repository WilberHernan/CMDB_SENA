  /* ================================================================

     ================================================================ */
  (function() {
    const saved = localStorage.getItem('cmdb-theme');
    if (saved) {
      document.documentElement.setAttribute('data-theme', saved);
    }

    function updateThemeIcon(theme) {
      const wrap = document.getElementById('themeIconWrap');
      if (wrap) wrap.innerHTML = theme === 'dark' ? LUCIDE.moon : LUCIDE.sun;
    }

    updateThemeIcon(document.documentElement.getAttribute('data-theme') || 'light');

    document.getElementById('themeToggle').addEventListener('click', () => {
      const current = document.documentElement.getAttribute('data-theme') || 'light';
      const next = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('cmdb-theme', next);
      updateThemeIcon(next);
    });
  })();

  (function() {

      { threshold: [1] }

    observer.observe(sentinel);
  })();

    const wrapper = document.createElement('div');
    wrapper.className = 'custom-select';
    wrapper.dataset.index = index;

    const trigger = document.createElement('button');
    trigger.type = 'button';
    trigger.className = 'select-trigger';
    trigger.innerHTML = `<span class="select-trigger-text placeholder">${placeholder}</span>${LUCIDE.chevronDown}`;
    trigger.setAttribute('aria-haspopup', 'listbox');

    const dropdown = document.createElement('div');
    dropdown.className = 'select-dropdown';
    dropdown.setAttribute('role', 'listbox');

    wrapper.appendChild(trigger);
    wrapper.appendChild(dropdown);

    trigger.addEventListener('click', (e) => {
      e.stopPropagation();
      closeAllSelects(wrapper);
      wrapper.classList.toggle('open');
    });

    return wrapper;
  }

  function populateSelect(wrapper, options, selectedValue) {
    const dropdown = wrapper.querySelector('.select-dropdown');
    dropdown.innerHTML = '';

    options.forEach(opt => {
      const item = document.createElement('div');
      item.className = 'select-option';
      item.setAttribute('role', 'option');
      item.dataset.value = opt;
      item.innerHTML = `${LUCIDE.check}<span>${opt}</span>`;

      if (opt === selectedValue) item.classList.add('selected');

      item.addEventListener('click', (e) => {
        e.stopPropagation();
        selectOption(wrapper, opt);
      });

      dropdown.appendChild(item);
    });
  }

  function selectOption(wrapper, value) {
    const triggerText = wrapper.querySelector('.select-trigger-text');
    triggerText.textContent = value || 'Seleccione...';
    triggerText.classList.toggle('placeholder', !value);

    wrapper.querySelectorAll('.select-option').forEach(opt => {
      opt.classList.toggle('selected', opt.dataset.value === value);
    });

    wrapper.classList.remove('open');
    wrapper.dataset.value = value || '';
  }

  function closeAllSelects(except) {
    document.querySelectorAll('.custom-select.open').forEach(el => {
      if (el !== except) el.classList.remove('open');
    });
  }

  document.addEventListener('click', () => closeAllSelects(null));

  /* ================================================================
     GENERACIÓN DE CAMPOS CON SECCIONES
     ================================================================ */
  document.addEventListener('DOMContentLoaded', () => {
    let lastSection = null;

    COLUMNAS.forEach((nombre, index) => {
      if (SECCIONES[index] && SECCIONES[index] !== lastSection) {
        lastSection = SECCIONES[index];
        const sectionDiv = document.createElement('div');
        sectionDiv.className = 'section-header';
        sectionDiv.innerHTML = `<span>${SECCIONES[index]}</span>`;
        dynamicGrid.appendChild(sectionDiv);
      }

      const div = document.createElement('div');
      div.className = 'field-group';
      if (nombre === "Observaciones") div.classList.add('full-width');

      const label = document.createElement('label');
      label.className = 'field-label';
      label.innerHTML = `<span class="field-num">${index + 1}</span>${nombre}`;

      let input;

      if (VALIDACIONES_INDICES.includes(index) && index !== 6) {
        input = createCustomSelect(index, 'Seleccione...');
      } else if (nombre === "Observaciones") {
        input = document.createElement('textarea');
        input.rows = 3;
      } else {
        input = document.createElement('input');
        input.type = 'text';
      }

      input.id = 'col_' + index;
      if (index === 6) input.readOnly = true;

      div.appendChild(label);
      div.appendChild(input);
      dynamicGrid.appendChild(div);
    });

    // Setup scan mode buttons
    document.getElementById('modeScanner').addEventListener('click', () => switchScanMode('scanner'));
    document.getElementById('modeCamera').addEventListener('click', () => switchScanMode('camera'));
    document.getElementById('btnCamera').addEventListener('click', () => document.getElementById('cameraInput').click());
    document.getElementById('cameraInput').addEventListener('change', escanearImagen);
    document.getElementById('btnGuardar').addEventListener('click', guardarCambios);

    // Si venimos desde el script de inventario local con datos precargados
    if (QUERY_PARAMS && QUERY_PARAMS.placa) {
      iniciarModoNuevo(QUERY_PARAMS);
    }

    // Sanitizar en tiempo real: apóstrofos -> guiones, TODO TEXTO -> MAYÚSCULAS
    dynamicGrid.addEventListener('input', function(e) {
      const target = e.target;
      if (ES_CAMPO_TEXTO(target)) {
        if (target.value.includes("'")) {
          target.value = target.value.replace(/'/g, '-');
        }
        // Forzar mayúsculas en todos los campos de texto (inputs y textarea)
        target.value = target.value.toUpperCase();
      }
    });
  });

  /* ================================================================
     EVENTOS DEL ESCANER
     ================================================================ */
  scannerInput.addEventListener('input', function() {
    clearTimeout(typingTimer);
    if (scannerInput.value.length > 0) {
      typingTimer = setTimeout(ejecutarBusqueda, doneTypingInterval);
    }
  });

  scannerInput.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      clearTimeout(typingTimer);
      ejecutarBusqueda();
    }
  });

  // Efecto scanning en focus/blur
  scannerInput.addEventListener('focus', function() {
    const wrap = document.querySelector('.input-main-wrap');
    if (wrap) wrap.classList.add('scanning');
  });
  scannerInput.addEventListener('blur', function() {
    const wrap = document.querySelector('.input-main-wrap');
    if (wrap) wrap.classList.remove('scanning');
  });

  function ejecutarBusqueda() {
    procesarLectura(scannerInput.value);
  }

  /* ================================================================
     CAMBIO DE MODO (Escáner / Cámara)
     ================================================================ */
  function switchScanMode(mode) {
    const scannerSection = document.getElementById('scannerSection');
    const cameraSection = document.getElementById('cameraSection');
    const modeScanner = document.getElementById('modeScanner');
    const modeCamera = document.getElementById('modeCamera');
    const scanDesc = document.getElementById('scanDesc');

    if (mode === 'scanner') {
      scannerSection.style.display = 'block';
      cameraSection.style.display = 'none';
      modeScanner.classList.add('active');
      modeCamera.classList.remove('active');
      scanDesc.textContent = 'Posiciona el cursor en el campo y escanea la placa con el lector.';
      setTimeout(() => scannerInput.focus(), 100);
    } else {
      scannerSection.style.display = 'none';
      cameraSection.style.display = 'block';
      modeScanner.classList.remove('active');
      modeCamera.classList.add('active');
      scanDesc.textContent = 'Apunta a la placa, toca el botón y saca la foto.';
      document.getElementById('cameraInput').value = '';
      document.getElementById('cameraStatus').innerHTML = 'Apunta a la placa, toca el botón y saca la foto';
    }
  }

  /* ================================================================
     ESCANEO CON CÁMARA
     ================================================================ */
  let html5QrCode;

  function escanearImagen(event) {
    if (event.target.files.length == 0) return;

    const file = event.target.files[0];
    const cameraStatus = document.getElementById('cameraStatus');
    cameraStatus.innerHTML = "Analizando imagen... ⏳";

    if(!html5QrCode) {
      html5QrCode = new Html5Qrcode("reader");
    }

    html5QrCode.scanFile(file, true)
      .then(decodedText => {
        cameraStatus.innerHTML = `<span style='color: var(--success);'>¡Código detectado: <b>${decodedText}</b>! Buscando en BD...</span>`;
        procesarLectura(decodedText);
      })
      .catch(err => {
        cameraStatus.innerHTML = `<span style='color: var(--danger);'>⚠ No se detectó código. Intente tomar la foto más cerca y sin reflejos.</span>`;
      });
  }

  function procesarLectura(textoEscaneado) {
    let placaLimpia = textoEscaneado.toString().replace(/'/g, '-').replace(/[^a-zA-Z0-9-]/g, '').toUpperCase();
    if (placaLimpia.length === 0) return;
    buscar(placaLimpia);
  }

  /* ================================================================
     BÚSQUEDA
     ================================================================ */
  function buscar(placa) {
    loader.style.display = 'flex';
    status.innerHTML = '';
    formContainer.style.display = 'none';

    google.script.run
      .withSuccessHandler(function(resultado) {
        loader.style.display = 'none';
        if (resultado) {
          cargarDatosEnFormulario(resultado);
          renderAlert('success', 'Equipo encontrado correctamente.');
        } else {
          renderNotFound(placa);
        }
      })
      .withFailureHandler(function(error) {
        loader.style.display = 'none';
        renderAlert('error', 'Error de conexión con Google Sheets.');
      })
      .buscarEquipo(placa);
  }

  /* ================================================================
     CARGAR DATOS
     ================================================================ */
  function cargarDatosEnFormulario(resultado) {
    const badge = document.getElementById('hojaBadge');
    badge.innerText = `${resultado.hoja} · Fila ${resultado.fila}`;
    badge.className = 'badge-meta accent';

    document.getElementById('filaActual').value = resultado.fila;
    document.getElementById('hojaActual').value = resultado.hoja;

    currentValidaciones = resultado.validaciones || {};

    // Guardar propietario original para detectar cambios de hoja
    window.propietarioOriginal = (resultado.valores[2] || '').toString().toUpperCase().trim();
    inicializarObserverPropietario();
    inicializarSincronizacionSede();

    for (let i = 0; i < 51; i++) {
      const el = document.getElementById('col_' + i);
      if (!el) continue;

      const valor = resultado.valores[i] || "";

      if (el.classList.contains('custom-select')) {
        const opciones = currentValidaciones[i] || [];
        populateSelect(el, opciones, valor);
        selectOption(el, valor);
      } else {
        // Forzar mayúsculas al cargar datos existentes
        el.value = (valor || '').toString().toUpperCase();
      }
    }

    formContainer.style.display = 'block';
    scannerInput.value = '';

    setTimeout(() => {
      formContainer.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, 80);
  }

  /* ================================================================
     UTILIDAD: Fuzzy match para selects
     ================================================================ */
  function normalizeOption(str) {
    return str.toString().toUpperCase().trim().replace(/\s+/g, ' ');
  }

  function findMatchingOption(valor, opciones) {
    if (!valor) return null;
    const normalizedValor = normalizeOption(valor);
    let match = opciones.find(opt => normalizeOption(opt) === normalizedValor);
    if (match) return match;
    const compactValor = normalizedValor.replace(/\s/g, '');
    match = opciones.find(opt => normalizeOption(opt).replace(/\s/g, '') === compactValor);
    if (match) return match;
    match = opciones.find(opt => normalizeOption(opt).includes(normalizedValor) || normalizedValor.includes(normalizeOption(opt)));
    return match || null;
  }

  /* ================================================================
     OBSERVER: Cambio de propietario -> Feedback visual de hoja destino
     ================================================================ */
  function inicializarObserverPropietario() {
    const propietarioSelect = document.getElementById('col_2');
    if (!propietarioSelect) return;

    const observer = new MutationObserver(function(mutations) {
      mutations.forEach(function(mutation) {
        if (mutation.type === 'attributes' && mutation.attributeName === 'data-value') {
          const nuevoPropietario = (propietarioSelect.dataset.value || '').toUpperCase();
          const hojaActual = document.getElementById('hojaActual').value;
          const hojaDestino = (nuevoPropietario === 'TELEFONICA') ? 'EquiposTelefonica' : 'EquiposSena';
          const badge = document.getElementById('hojaBadge');

          if (hojaDestino !== hojaActual && window.propietarioOriginal && nuevoPropietario !== window.propietarioOriginal) {
            badge.innerText = `Se moverá a: ${hojaDestino}`;
            badge.className = 'badge-meta blue';
          } else {
            badge.innerText = `${hojaActual} · Fila ${document.getElementById('filaActual').value}`;
            badge.className = 'badge-meta accent';
          }
        }
      });
    });

    observer.observe(propietarioSelect, { attributes: true });
  }

  /* ================================================================
     SINCRONIZACIÓN: ID SEDE ↔ NOMBRE DE LA SEDE
     ================================================================ */
  function inicializarSincronizacionSede() {
    const idSelect = document.getElementById('col_7');
    const sedeSelect = document.getElementById('col_8');
    if (!idSelect || !sedeSelect) return;

    // Mapeo bidireccional inyectado desde el backend
    const sedeAId = MAPEO_SEDE_ID && MAPEO_SEDE_ID.sedeAId ? MAPEO_SEDE_ID.sedeAId : {};
    const idASede = MAPEO_SEDE_ID && MAPEO_SEDE_ID.idASede ? MAPEO_SEDE_ID.idASede : {};

    // Cuando cambia NOMBRE DE LA SEDE → actualizar ID SEDE
    const sedeObserver = new MutationObserver(function(mutations) {
      mutations.forEach(function(mutation) {
        if (mutation.type === 'attributes' && mutation.attributeName === 'data-value') {
          const sede = (sedeSelect.dataset.value || '').toUpperCase();
          if (sede && sedeAId[sede]) {
            const idNuevo = sedeAId[sede];
            // Solo actualizar si es diferente para evitar loops
            if (idSelect.dataset.value !== idNuevo) {
              populateSelect(idSelect, VALIDACIONES_GLOBALES[7] || [], idNuevo);
              selectOption(idSelect, idNuevo);
            }
          }
        }
      });
    });

    // Cuando cambia ID SEDE → actualizar NOMBRE DE LA SEDE
    const idObserver = new MutationObserver(function(mutations) {
      mutations.forEach(function(mutation) {
        if (mutation.type === 'attributes' && mutation.attributeName === 'data-value') {
          const id = (idSelect.dataset.value || '').toString().trim();
          if (id && idASede[id]) {
            const sedeNueva = idASede[id];
            // Solo actualizar si es diferente para evitar loops
            if (sedeSelect.dataset.value !== sedeNueva) {
              populateSelect(sedeSelect, VALIDACIONES_GLOBALES[8] || [], sedeNueva);
              selectOption(sedeSelect, sedeNueva);
            }
          }
        }
      });
    });

    sedeObserver.observe(sedeSelect, { attributes: true });
    idObserver.observe(idSelect, { attributes: true });
  }

  /* ================================================================
     MODO NUEVO EQUIPO (desde script local)
     ================================================================ */
  function iniciarModoNuevo(params) {
    esModoNuevo = true;
    loader.style.display = 'none';
    formContainer.style.display = 'block';

    const scanDesc = document.getElementById('scanDesc');
    scanDesc.innerHTML = `<span class="mode-indicator new"><span style="display:flex;align-items:center;">${LUCIDE.sparkles}</span>Modo registro automático. Verificá los datos detectados, completá lo que falta y guardá.</span>`;

    const badge = document.getElementById('hojaBadge');
    badge.innerText = 'NUEVO EQUIPO';
    badge.className = 'badge-meta blue';

    currentValidaciones = VALIDACIONES_GLOBALES || {};

    const defaultsNuevo = {
      18: 'N/A', 19: 'N/A', 23: 'N/A', 24: 'N/A',
      25: 'N/A', 26: 'N/A', 28: 'N/A', 44: 'N/A',
      35: 'SI', 36: 'SI', 37: 'SI', 38: 'SI'
    };

    const mapeo = {
      0: params.hostname,
      3: params.marca,
      4: params.modelo,
      5: params.serial,
      6: params.placa,
      16: params.procesador,
      17: params.disco1_tipo,
      18: params.disco1_tam,
      19: params.disco2_tipo,
      20: params.disco2_tam,
      21: params.tipo_memoria,
      22: params.ram,
      23: params.video,
      31: params.mac_cableada,
      32: params.mac_wifi,
      33: params.so,
      34: params.version_so,
      47: params.fecha_mantenimiento,
      48: params.fecha_impacto
    };

    for (let i = 0; i < 51; i++) {
      const el = document.getElementById('col_' + i);
      if (!el) continue;

      if (el.classList.contains('custom-select')) {
        const opciones = currentValidaciones[i] || [];
        if (opciones.length > 0 && el.querySelectorAll('.select-option').length === 0) {
          populateSelect(el, opciones, '');
        }
      }

      let valor = '';

      if (mapeo.hasOwnProperty(i)) {
        valor = (mapeo[i] || '').toString().toUpperCase().trim();
      }

      if (!valor && defaultsNuevo.hasOwnProperty(i)) {
        valor = defaultsNuevo[i];
      }

      if (valor) {
        if (el.classList.contains('custom-select')) {
          const opciones = currentValidaciones[i] || [];
          const match = findMatchingOption(valor, opciones);
          if (match) {
            selectOption(el, match);
          } else {
            selectOption(el, '');
          }
        } else {
          el.value = valor;
        }
      }
    }

    const placaEl = document.getElementById('col_6');
    if (placaEl) placaEl.readOnly = true;

    const btn = document.getElementById('btnGuardar');
    if (btn) {
      btn.innerHTML = `${LUCIDE.plus}Registrar Nuevo Equipo`;
    }

    inicializarSincronizacionSede();

    setTimeout(() => {
      formContainer.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, 80);
  }

  /* ================================================================
     GUARDAR CAMBIOS
     ================================================================ */
  function guardarCambios() {
    const valoresActualizados = [];

    for (let i = 0; i < 51; i++) {
      const el = document.getElementById('col_' + i);
      if (!el) {
        valoresActualizados.push("");
        continue;
      }

      let valor;
      if (el.classList.contains('custom-select')) {
        valor = el.dataset.value || "";
      } else {
        valor = el.value;
      }

      if (typeof valor === 'string') {
        valor = valor.replace(/'/g, '-').toUpperCase();
      }

      valoresActualizados.push(valor);
    }

    const btn = document.getElementById('btnGuardar');
    btn.disabled = true;

    if (esModoNuevo) {
      const propietario = valoresActualizados[2] || '';
      const hojaDestino = (propietario === 'TELEFONICA') ? 'EquiposTelefonica' : 'EquiposSena';
      const datos = {
        hoja: hojaDestino,
        valores: valoresActualizados
      };

      renderAlert('info', 'Registrando nuevo equipo en CMDB...');

      google.script.run
        .withSuccessHandler(function(respuesta) {
          btn.disabled = false;
          if (respuesta && respuesta.exito) {
            renderAlert('success', respuesta.mensaje);
            formContainer.style.display = 'none';
            esModoNuevo = false;
            btn.innerHTML = `${LUCIDE.save}Guardar Actualización`;
            scannerInput.focus();
          } else {
            renderAlert('error', 'Error al registrar: ' + (respuesta ? respuesta.mensaje : 'Error desconocido'));
          }
        })
        .withFailureHandler(function(error) {
          btn.disabled = false;
          renderAlert('error', 'Fallo crítico de conexión: ' + error.message);
        })
        .crearEquipo(datos);

    } else {
      const datos = {
        fila: document.getElementById('filaActual').value,
        hoja: document.getElementById('hojaActual').value,
        valores: valoresActualizados
      };

      renderAlert('info', 'Sincronizando con CMDB, por favor espere...');

      google.script.run
        .withSuccessHandler(function(respuesta) {
          btn.disabled = false;
          if(respuesta && respuesta.exito) {
            renderAlert('success', respuesta.mensaje);
            formContainer.style.display = 'none';
            scannerInput.focus();
          } else {
            renderAlert('error', 'Fallo en la base de datos: ' + (respuesta ? respuesta.mensaje : 'Error desconocido'));
          }
        })
        .withFailureHandler(function(error) {
           btn.disabled = false;
           renderAlert('error', 'Fallo crítico de conexión: ' + error.message);
        })
        .actualizarEquipo(datos);
    }
  }

  /* ================================================================
     EMPTY STATE — Equipo no encontrado
     ================================================================ */
  function renderNotFound(placa) {
    scannerInput.value = '';

    const searchIcon = LUCIDE.search;
    const plusIcon = LUCIDE.plus;
    const helpIcon = LUCIDE.helpCircle;

    status.innerHTML = `
      <div class="empty-state-card">
        <div class="empty-state-visual">
          <div class="empty-state-icon-wrap">
            <div class="empty-state-icon-inner">
              ${searchIcon}
            </div>
            <div class="empty-state-badge">${helpIcon}</div>
          </div>
        </div>
        <h2 class="empty-state-title">Equipo no encontrado</h2>
        <p class="empty-state-desc">
          La placa <span class="empty-state-placa">${placa}</span> no existe en la base de datos.<br>
          Verificá que esté bien escaneada o registrá el equipo como nuevo.
        </p>
        <div class="empty-state-actions">
          <button type="button" class="empty-state-btn" id="btnReintentar">
            ${searchIcon}
            Escanear otra placa
          </button>
          <button type="button" class="empty-state-btn empty-state-btn-primary" id="btnRegistrarNuevo">
            ${plusIcon}
            Registrar nuevo
          </button>
        </div>
      </div>
    `;

    setTimeout(() => {
      const btnReintentar = document.getElementById('btnReintentar');
      const btnRegistrar = document.getElementById('btnRegistrarNuevo');

      if (btnReintentar) {
        btnReintentar.addEventListener('click', () => {
          status.innerHTML = '';
          scannerInput.focus();
        });
      }

      if (btnRegistrar) {
        btnRegistrar.addEventListener('click', () => {
          status.innerHTML = '';
          iniciarModoNuevo({ placa: placa });
        });
      }
    }, 0);
  }

  /* ================================================================
     ALERTAS
     ================================================================ */
  function renderAlert(type, message) {
    const icons = {
      success: LUCIDE.circleCheck,
      error: LUCIDE.circleX,
      info: LUCIDE.circleAlert,
      warning: LUCIDE.circleAlert
    };
    status.innerHTML = `<div class="alert alert-${type} glass"><span class="alert-icon">${icons[type]}</span><span>${message}</span></div>`;
  }
</script>

</body>
