<style>
/* ================================================================
   CMDB SENA CCYS — Component Styles v4.0
   ================================================================ */

/* —— App Layout —— */
.app {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px 16px 24px;
  display: flex;
  flex-direction: column;
  gap: 20px;
  position: relative;
  z-index: 1;
}
@media (min-width: 768px) { .app { padding: 28px 32px 32px; } }

/* —— Header —— */
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 20px;
  border-radius: 20px;
  margin-bottom: 4px;
  transition: border-radius 350ms cubic-bezier(0.4, 0, 0.2, 1),
              box-shadow 350ms cubic-bezier(0.4, 0, 0.2, 1),
              background 350ms cubic-bezier(0.4, 0, 0.2, 1),
              backdrop-filter 350ms ease;
}
.header.glass {
  position: sticky;
  top: 0;
  z-index: 50;
}
.header.is-stuck {
  border-radius: 0 0 18px 18px;
  backdrop-filter: blur(28px) saturate(180%);
  -webkit-backdrop-filter: blur(28px) saturate(180%);
  box-shadow: 0 8px 32px rgba(0,0,0,0.35), 0 1px 0 var(--glass-border-hover);
  border-color: var(--glass-border-hover);
}
[data-theme="light"] .header.is-stuck {
  box-shadow: 0 8px 32px rgba(0,0,0,0.1), 0 1px 0 var(--glass-border-hover);
}

.brand {
  display: flex;
  align-items: center;
  gap: 14px;
}
.brand-mark {
  width: 48px;
  height: 48px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  border-radius: 14px;
  background: linear-gradient(135deg, var(--sena-green), var(--accent));
  box-shadow: 0 4px 16px var(--sena-green-glow);
}
.brand-mark img {
  width: 32px;
  height: 32px;
  object-fit: contain;
  display: block;
  filter: brightness(0) invert(1);
}
.brand-title {
  font-size: 1.125rem;
  font-weight: 700;
  letter-spacing: -0.02em;
  line-height: 1.2;
}
.brand-subtitle {
  font-size: 0.8125rem;
  color: var(--text-secondary);
  font-weight: 500;
}

.header-actions {
  display: flex;
  align-items: center;
  gap: 10px;
}

/* Status dot */
.status-pill {
  display: none;
  align-items: center;
  gap: 8px;
  padding: 6px 12px;
  border-radius: 10px;
  font-size: 0.75rem;
  font-weight: 600;
  color: var(--text-secondary);
  font-family: 'SF Mono', Monaco, monospace;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  background: var(--bg-elevated);
  border: 1px solid var(--border-default);
}
@media (min-width: 640px) { .status-pill { display: flex; } }
.status-dot {
  width: 6px;
  height: 6px;
  background: var(--accent);
  border-radius: 50%;
  animation: pulse-glow 2.5s ease-in-out infinite;
}

/* Theme toggle */
.theme-toggle {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 38px;
  height: 38px;
  border-radius: 12px;
  background: var(--bg-elevated);
  border: 1px solid var(--border-default);
  color: var(--text-secondary);
  cursor: pointer;
  transition: all 200ms ease;
}
.theme-toggle:hover {
  border-color: var(--border-hover);
  color: var(--text-primary);
  background: var(--bg-hover);
  transform: translateY(-1px);
}
.theme-toggle:active { transform: scale(0.95); }

/* —— Scan Card —— */
.scan-card {
  text-align: center;
  position: relative;
  overflow: hidden;
  border-radius: 24px;
  padding: 36px 28px;
}
.scan-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 40px;
  right: 40px;
  height: 1.5px;
  background: var(--grad-border);
  opacity: var(--scan-line-opacity);
}
.scan-card .orbit-container {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  opacity: 0.15;
  pointer-events: none;
}

.scan-card h2 {
  font-size: 1.5rem;
  font-weight: 700;
  margin-bottom: 8px;
  letter-spacing: -0.02em;
  position: relative;
  z-index: 1;
}
.scan-card p {
  color: var(--text-secondary);
  font-size: 0.9375rem;
  margin-bottom: 28px;
  max-width: 420px;
  margin-left: auto;
  margin-right: auto;
  position: relative;
  z-index: 1;
}

/* —— Scan Modes —— */
.scan-modes {
  display: flex;
  gap: 12px;
  justify-content: center;
  margin-bottom: 24px;
  position: relative;
  z-index: 1;
}
.scan-mode {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 20px;
  border-radius: 14px;
  font-size: 0.9375rem;
  font-weight: 600;
  color: var(--text-secondary);
  outline: none;
  font-family: inherit;
}
.scan-mode:hover {
  color: var(--text-primary);
}
.scan-mode.active {
  color: var(--accent);
}
.scan-mode svg {
  transition: transform 200ms ease;
}
.scan-mode:hover svg {
  transform: scale(1.1);
}

/* —— Camera button —— */
.camera-btn-wrap {
  display: inline-block;
  padding: 3px;
  border-radius: 20px;
  background: linear-gradient(60deg, var(--accent), var(--sena-green-light), var(--accent));
  background-size: 400% 400%;
  animation: gradient-shift 6s ease infinite;
  opacity: 0.85;
  transition: opacity 200ms ease, box-shadow 300ms ease, transform 200ms ease;
  box-shadow: 0 4px 20px rgba(0,0,0,0.3), 0 0 0 1px var(--border-subtle);
  position: relative;
}
.camera-btn-wrap::before {
  content: '';
  position: absolute;
  inset: -2px;
  border-radius: 22px;
  background: linear-gradient(60deg, var(--accent), var(--sena-green-light), var(--accent));
  background-size: 400% 400%;
  animation: gradient-shift 6s ease infinite;
  opacity: 0;
  filter: blur(8px);
  z-index: -1;
  transition: opacity 300ms ease;
}
.camera-btn-wrap:hover {
  opacity: 1;
  animation-duration: 3s;
  transform: translateY(-2px);
  box-shadow: 0 8px 40px var(--sena-green-glow), 0 0 0 1px var(--border-accent);
}
.camera-btn-wrap:hover::before {
  opacity: 0.5;
}
.camera-btn-wrap:active {
  transform: translateY(0) scale(0.98);
}
/* Barra pulsante en hover */
.camera-btn-wrap::after {
  content: '';
  position: absolute;
  bottom: 3px;
  left: 15%;
  right: 15%;
  height: 2px;
  border-radius: 1px;
  background: linear-gradient(90deg, transparent, var(--accent), transparent);
  opacity: 0;
  transition: opacity 300ms ease;
}
.camera-btn-wrap:hover::after {
  opacity: 0.6;
  animation: scan-pulse 1.5s ease-in-out infinite;
}
.camera-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 16px 36px;
  background: var(--bg-base);
  color: var(--text-primary);
  font-size: 1rem;
  font-weight: 700;
  letter-spacing: 0.02em;
  border: none;
  border-radius: 17px;
  cursor: pointer;
  transition: all 200ms ease;
  outline: none;
  font-family: inherit;
  box-shadow: inset 3px 3px 6px var(--neu-shadow-dark), inset -3px -3px 6px var(--neu-shadow-light);
}
.camera-btn:hover { 
  background: var(--bg-surface); 
}

.camera-status {
  margin-top: 14px;
  font-size: 0.875rem;
  font-weight: 500;
  color: var(--text-secondary);
  text-align: center;
  position: relative;
  z-index: 1;
}

/* —— Main Input —— */
.input-main-wrap {
  position: relative;
  max-width: 520px;
  margin: 0 auto;
  padding: 3px;
  border-radius: 20px;
  background: linear-gradient(60deg, var(--accent), var(--sena-green-light), var(--accent));
  background-size: 400% 400%;
  animation: gradient-shift 6s ease infinite;
  opacity: 0.85;
  transition: opacity 200ms ease, box-shadow 300ms ease, transform 200ms ease;
  box-shadow: 0 4px 20px rgba(0,0,0,0.3), 0 0 0 1px var(--border-subtle);
}
.input-main-wrap::before {
  content: '';
  position: absolute;
  inset: -2px;
  border-radius: 22px;
  background: linear-gradient(60deg, var(--accent), var(--sena-green-light), var(--accent));
  background-size: 400% 400%;
  animation: gradient-shift 6s ease infinite;
  opacity: 0;
  filter: blur(8px);
  z-index: -1;
  transition: opacity 300ms ease;
}
.input-main-wrap:focus-within {
  opacity: 1;
  animation-duration: 3s;
  transform: translateY(-2px);
  box-shadow: 0 8px 40px var(--sena-green-glow), 0 0 0 1px var(--border-accent);
}
.input-main-wrap:focus-within::before {
  opacity: 0.5;
}

/* Scanning indicator bar */
.input-main-wrap::after {
  content: '';
  position: absolute;
  bottom: 3px;
  left: 15%;
  right: 15%;
  height: 2px;
  border-radius: 1px;
  background: linear-gradient(90deg, transparent, var(--accent), transparent);
  opacity: 0;
  transition: opacity 300ms ease;
}
.input-main-wrap.scanning::after {
  opacity: 0.6;
  animation: scan-pulse 1.5s ease-in-out infinite;
}

.input-main {
  position: relative;
  display: flex;
  align-items: center;
  border-radius: 17px;
  background: var(--bg-base);
  box-shadow: inset 3px 3px 6px var(--neu-shadow-dark), inset -3px -3px 6px var(--neu-shadow-light);
}
.input-main-icon {
  position: absolute;
  left: 20px;
  color: var(--text-tertiary);
  pointer-events: none;
  z-index: 2;
  transition: color 300ms ease, transform 300ms ease;
}
.input-main:focus-within .input-main-icon {
  color: var(--accent);
  transform: scale(1.15);
}
#scannerInput {
  width: 100%;
  padding: 18px 22px 18px 56px;
  font-size: 1.125rem;
  font-weight: 600;
  font-family: 'SF Mono', Monaco, monospace;
  letter-spacing: 0.03em;
  color: var(--text-primary);
  background: transparent;
  border: none;
  border-radius: 17px;
  transition: all 200ms ease;
  outline: none;
  position: relative;
  z-index: 1;
}
#scannerInput::placeholder {
  color: var(--text-tertiary);
  font-weight: 400;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  letter-spacing: 0;
  font-size: 1rem;
}

/* —— Loader —— */
.loader-box {
  display: none;
  align-items: center;
  justify-content: center;
  gap: 12px;
  margin-top: 20px;
  font-size: 0.875rem;
  color: var(--text-secondary);
  font-weight: 500;
  position: relative;
  z-index: 1;
}
.spinner {
  width: 20px;
  height: 20px;
  border: 2.5px solid var(--border-default);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
}

/* —— Alerts —— */
.status-area { min-height: 60px; display: flex; align-items: center; }
.alert {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 18px;
  border-radius: 16px;
  font-size: 0.9375rem;
  font-weight: 500;
  animation: slide-down 0.35s ease-out;
  border: 1px solid transparent;
}
.alert-success {
  background: var(--success-soft);
  color: var(--success);
  border-color: rgba(74, 222, 128, 0.2);
}
.alert-error {
  background: var(--danger-soft);
  color: var(--danger);
  border-color: rgba(248, 113, 113, 0.2);
}
.alert-info {
  background: var(--info-soft);
  color: var(--info);
  border-color: rgba(96, 165, 250, 0.2);
}
.alert-warning {
  background: var(--warning-soft);
  color: var(--warning);
  border-color: rgba(251, 191, 36, 0.2);
}
.alert-icon {
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

/* —— Empty State —— */
.empty-state-card {
  max-width: 520px;
  margin: 32px auto;
  padding: 48px 32px 40px;
  text-align: center;
  border-radius: 28px;
  background: var(--glass-bg);
  backdrop-filter: blur(24px) saturate(150%);
  -webkit-backdrop-filter: blur(24px) saturate(150%);
  border: 1px solid var(--glass-border);
  box-shadow:
    0 24px 64px rgba(0,0,0,0.22),
    0 0 0 1px var(--border-subtle),
    inset 0 1px 0 var(--glass-highlight);
  animation: empty-state-in 0.65s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  position: relative;
  overflow: hidden;
}
.empty-state-card::before {
  content: '';
  position: absolute;
  top: -40%;
  left: -40%;
  width: 180%;
  height: 180%;
  background: radial-gradient(circle at 50% 45%, var(--warning-soft) 0%, transparent 55%);
  pointer-events: none;
}

@keyframes empty-state-in {
  from { opacity: 0; transform: translateY(24px) scale(0.96); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}

.empty-state-visual {
  margin-bottom: 28px;
  display: flex;
  justify-content: center;
  animation: empty-state-float 4.5s ease-in-out infinite;
  animation-delay: 0.3s;
}

@keyframes empty-state-float {
  0%, 100% { transform: translateY(0); }
  50%      { transform: translateY(-7px); }
}

.empty-state-icon-wrap {
  width: 116px;
  height: 116px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  background: linear-gradient(145deg, var(--bg-elevated), var(--bg-base));
  box-shadow:
    10px 10px 24px var(--neu-shadow-dark),
    -10px -10px 24px var(--neu-shadow-light),
    inset 2px 2px 4px var(--neu-shadow-light);
}
.empty-state-icon-inner {
  width: 68px;
  height: 68px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, var(--warning-soft), transparent 70%);
  color: var(--warning);
  position: relative;
}
.empty-state-icon-inner svg {
  width: 34px;
  height: 34px;
  stroke-width: 1.8;
}

.empty-state-badge {
  position: absolute;
  bottom: 4px;
  right: 4px;
  width: 34px;
  height: 34px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--warning);
  color: var(--bg-base);
  box-shadow: 0 4px 14px var(--warning-soft);
  border: 3px solid var(--bg-base);
  animation: empty-state-badge-in 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
  animation-delay: 0.5s;
  opacity: 0;
  transform: scale(0);
}
.empty-state-badge svg {
  width: 18px;
  height: 18px;
  stroke-width: 2.5;
}
@keyframes empty-state-badge-in {
  to { opacity: 1; transform: scale(1); }
}

.empty-state-title {
  font-size: 1.375rem;
  font-weight: 700;
  letter-spacing: -0.02em;
  margin-bottom: 10px;
  color: var(--text-primary);
  animation: empty-state-child-in 0.5s ease-out forwards;
  animation-delay: 0.15s;
  opacity: 0;
  transform: translateY(8px);
}
.empty-state-desc {
  font-size: 0.9375rem;
  color: var(--text-secondary);
  line-height: 1.65;
  max-width: 360px;
  margin: 0 auto 28px;
  animation: empty-state-child-in 0.5s ease-out forwards;
  animation-delay: 0.25s;
  opacity: 0;
  transform: translateY(8px);
}
@keyframes empty-state-child-in {
  to { opacity: 1; transform: translateY(0); }
}

.empty-state-placa {
  display: inline-block;
  font-family: 'SF Mono', Monaco, monospace;
  font-size: 0.8125rem;
  font-weight: 600;
  padding: 4px 10px;
  border-radius: 8px;
  background: var(--bg-elevated);
  color: var(--text-primary);
  border: 1px solid var(--border-default);
  box-shadow: inset 2px 2px 4px var(--neu-shadow-dark), inset -2px -2px 4px var(--neu-shadow-light);
  margin: 2px 2px;
  vertical-align: middle;
}

.empty-state-actions {
  display: flex;
  flex-direction: column;
  gap: 10px;
  justify-content: center;
  align-items: center;
  animation: empty-state-child-in 0.5s ease-out forwards;
  animation-delay: 0.4s;
  opacity: 0;
  transform: translateY(8px);
}
@media (min-width: 480px) {
  .empty-state-actions {
    flex-direction: row;
    gap: 12px;
  }
}

.empty-state-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 12px 24px;
  border-radius: 14px;
  font-size: 0.9375rem;
  font-weight: 600;
  color: var(--text-secondary);
  background: var(--bg-elevated);
  border: 1px solid var(--border-subtle);
  box-shadow:
    5px 5px 12px var(--neu-shadow-dark),
    -5px -5px 12px var(--neu-shadow-light);
  cursor: pointer;
  transition: all 200ms ease;
  font-family: inherit;
  outline: none;
}
.empty-state-btn:hover {
  transform: translateY(-2px);
  box-shadow:
    7px 7px 16px var(--neu-shadow-dark),
    -7px -7px 16px var(--neu-shadow-light);
  color: var(--text-primary);
}
.empty-state-btn:active {
  transform: translateY(0);
  box-shadow:
    inset 3px 3px 6px var(--neu-shadow-dark),
    inset -3px -3px 6px var(--neu-shadow-light);
}
.empty-state-btn svg {
  width: 18px;
  height: 18px;
  stroke-width: 2;
}
.empty-state-btn-primary {
  background: linear-gradient(135deg, var(--sena-green), var(--accent-hover));
  color: #fff;
  border-color: transparent;
  box-shadow: 0 4px 16px var(--sena-green-glow);
}
.empty-state-btn-primary:hover {
  box-shadow: 0 6px 24px var(--sena-green-glow);
  transform: translateY(-2px);
  color: #fff;
}
.empty-state-btn-primary:active {
  transform: translateY(0) scale(0.98);
  box-shadow: 0 2px 8px var(--sena-green-glow);
}

/* —— Form Wrapper —— */
.form-wrapper {
  display: none;
  animation: fade-in-up 0.4s ease-out;
}
.form-card {
  border-radius: 24px;
  padding: 32px;
}
@media (max-width: 639px) { .form-card { padding: 24px; } }

.form-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 12px;
  margin-bottom: 28px;
  padding-bottom: 20px;
  border-bottom: 1px solid var(--border-default);
}
.form-header h3 {
  font-size: 1.125rem;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 10px;
  letter-spacing: -0.01em;
}

/* Badge meta */
.badge-meta {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 6px 14px;
  border-radius: 10px;
  font-size: 0.8125rem;
  font-weight: 600;
  font-family: 'SF Mono', Monaco, monospace;
}
.badge-meta.accent {
  background: var(--accent-soft);
  color: var(--accent);
  border: 1px solid var(--border-accent);
}
.badge-meta.blue {
  background: var(--mode-blue-soft);
  color: var(--mode-blue);
  border: 1px solid var(--mode-blue-glow);
}

/* —— Section Headers —— */
.section-header {
  grid-column: 1 / -1;
  display: flex;
  align-items: center;
  gap: 12px;
  margin-top: 8px;
  margin-bottom: 4px;
  padding-bottom: 8px;
}
.section-header span {
  font-size: 0.75rem;
  font-weight: 700;
  color: var(--text-tertiary);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  white-space: nowrap;
}
.section-header::after {
  content: '';
  flex: 1;
  height: 1px;
  background: linear-gradient(90deg, var(--border-default), transparent);
}

/* —— Form Grid —— */
.form-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 18px;
}
@media (min-width: 640px) { .form-grid { grid-template-columns: repeat(2, 1fr); gap: 18px; } }
@media (min-width: 1024px) { .form-grid { grid-template-columns: repeat(3, 1fr); } }

.field-group {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.field-group.full-width { grid-column: 1 / -1; }

.field-label {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 0.6875rem;
  font-weight: 600;
  color: var(--text-tertiary);
  text-transform: uppercase;
  letter-spacing: 0.07em;
}
.field-num {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 20px;
  height: 20px;
  background: var(--bg-elevated);
  color: var(--text-tertiary);
  font-size: 0.625rem;
  font-weight: 700;
  border-radius: 6px;
  border: 1px solid var(--border-default);
  font-family: 'SF Mono', Monaco, monospace;
}

/* —— Inputs & Textarea —— */
input[type="text"],
textarea {
  padding: 12px 14px;
  font-size: 0.9375rem;
  color: var(--text-primary);
  background: var(--bg-input);
  border: 1px solid var(--border-default);
  border-radius: 12px;
  transition: all 200ms ease;
  outline: none;
  width: 100%;
  font-family: inherit;
  box-shadow: inset 2px 2px 4px var(--neu-shadow-dark), inset -2px -2px 4px var(--neu-shadow-light);
}
input[type="text"]:hover,
textarea:hover { border-color: var(--border-hover); }
input[type="text"]:focus,
